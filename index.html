<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Allocation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9f9f8; color: #1a1a1a; padding: 2rem; min-height: 100vh; }
  .container { max-width: 680px; margin: 0 auto; }
  .hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; gap: 8px; flex-wrap: wrap; }
  .hdr-title { font-size: 14px; font-weight: 500; color: #888; }
  .controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .btn { background: transparent; border: 0.5px solid #ccc; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; color: #1a1a1a; line-height: 1.5; display: inline-flex; align-items: center; gap: 4px; }
  .btn:hover:not(:disabled) { background: #f0f0ef; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .week-label { font-size: 13px; font-weight: 500; min-width: 140px; text-align: center; }
  input[type=date] { font-size: 12px; padding: 4px 8px; border: 0.5px solid #ccc; border-radius: 8px; background: #fff; color: #666; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.5rem; }
  .card { border-radius: 12px; padding: 1rem 1rem 0.85rem; border: 0.5px solid #e8e8e6; background: #fff; }
  .card-label { font-size: 11px; color: #888; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 5px; }
  .card-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .card-pct { font-size: 26px; font-weight: 500; line-height: 1; margin-bottom: 0.2rem; }
  .card-h { font-size: 12px; color: #888; }
  .card.client .card-pct { color: #1D9E75; }
  .card.sales .card-pct { color: #378ADD; }
  .card.other .card-pct { color: #888780; }
  .card.blank .card-pct { color: #bbb; }
  .bar-row { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 1.5rem; background: #eee; }
  .bar-seg { height: 100%; transition: width 0.4s ease; min-width: 0; }
  .stale { font-size: 11px; color: #bbb; text-align: right; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @media (max-width: 480px) {
    body { padding: 1rem; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .controls { gap: 4px; }
    .week-label { min-width: 110px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="hdr">
    <span class="hdr-title">time allocation</span>
    <div class="controls">
      <button class="btn" id="btn-prev" onclick="navigate(-1)">&#8592;</button>
      <span class="week-label" id="week-label">—</span>
      <button class="btn" id="btn-next" onclick="navigate(1)">&#8594;</button>
      <input type="date" id="date-from" title="de">
      <span style="font-size:11px;color:#bbb">→</span>
      <input type="date" id="date-to" title="até">
      <button class="btn" onclick="jumpToRange()">ir</button>
      <button class="btn" id="btn-refresh" onclick="resetToCurrentWeek()" title="voltar à semana atual e atualizar">&#8635;</button>
    </div>
  </div>

  <div class="grid">
    <div class="card client">
      <div class="card-label"><span class="card-dot" style="background:#1D9E75"></span>client</div>
      <div class="card-pct" id="p-client">—</div>
      <div class="card-h" id="h-client">—</div>
    </div>
    <div class="card sales">
      <div class="card-label"><span class="card-dot" style="background:#378ADD"></span>sales</div>
      <div class="card-pct" id="p-sales">—</div>
      <div class="card-h" id="h-sales">—</div>
    </div>
    <div class="card other">
      <div class="card-label"><span class="card-dot" style="background:#888780"></span>other</div>
      <div class="card-pct" id="p-other">—</div>
      <div class="card-h" id="h-other">—</div>
    </div>
    <div class="card blank">
      <div class="card-label"><span class="card-dot" style="background:#ddd"></span>blank</div>
      <div class="card-pct" id="p-blank">—</div>
      <div class="card-h" id="h-blank">—</div>
    </div>
  </div>

  <div class="bar-row">
    <div class="bar-seg" id="bar-client" style="background:#1D9E75;width:0%"></div>
    <div class="bar-seg" id="bar-sales"  style="background:#378ADD;width:0%"></div>
    <div class="bar-seg" id="bar-other"  style="background:#888780;width:0%"></div>
    <div class="bar-seg" id="bar-blank"  style="background:#e0e0de;width:0%"></div>
  </div>

  <div class="stale" id="stale-note"></div>
</div>

<script>
const WEBHOOK = 'https://n8n.codeforall.com/webhook/time-alloc-gf';
let weekOffset = 0;

function syncNavButtons() {
  document.getElementById('btn-next').disabled = weekOffset >= 0;
}

function navigate(delta) {
  weekOffset += delta;
  syncNavButtons();
  fetchData();
}

function jumpToRange() {
  const f = document.getElementById('date-from').value;
  const t = document.getElementById('date-to').value;
  if (!f || !t) return;
  weekOffset = 0;
  fetchData(f, t);
}

function resetToCurrentWeek() {
  weekOffset = 0;
  document.getElementById('date-from').value = '';
  document.getElementById('date-to').value = '';
  syncNavButtons();
  fetchData();
}

function setLoading(on) {
  const refresh = document.getElementById('btn-refresh');
  refresh.innerHTML = on ? '<span class="spin">&#8635;</span>' : '&#8635;';
  refresh.disabled = on;
  document.getElementById('btn-prev').disabled = on;
  document.getElementById('btn-next').disabled = on || weekOffset >= 0;
}

function render(data) {
  document.getElementById('week-label').textContent = data.weekLabel || '—';
  ['client', 'sales', 'other', 'blank'].forEach(k => {
    document.getElementById('p-' + k).textContent = (data[k]?.pct ?? 0) + '%';
    document.getElementById('h-' + k).textContent = data[k]?.hours ?? '—';
    document.getElementById('bar-' + k).style.width = (data[k]?.pct ?? 0) + '%';
  });
  document.getElementById('stale-note').textContent = 'atualizado ' + (data.fetchedAt || '—');
}

async function fetchData(customFrom, customTo) {
  setLoading(true);
  try {
    const url = (customFrom && customTo)
      ? WEBHOOK + '?dateFrom=' + customFrom + '&dateTo=' + customTo
      : WEBHOOK + '?weekOffset=' + weekOffset;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error('resposta inválida do servidor'); }
    render(data);
  } catch (e) {
    document.getElementById('stale-note').textContent = 'erro: ' + e.message;
  } finally {
    setLoading(false);
  }
}

syncNavButtons();
fetchData();
</script>
</body>
</html>
